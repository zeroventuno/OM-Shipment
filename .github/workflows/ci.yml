name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # O build roda sem as variáveis do Supabase de propósito: se ele quebrar
      # sem elas, é porque algo passou a exigir a conexão em tempo de build.
      - name: Build
        run: npm run build

      - name: Auditoria de segurança
        run: npm audit --audit-level=high
