<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Officine Mattio - Richiesta di ferie</title>
  <meta name="description" content="Chiedi le ferie e guarda la mappa della squadra." />
  <meta name="theme-color" content="#0A0A0A" />

  <!-- Mesma aplicação do index.html, com a prévia do pedido de férias dos
       funcionários (link pessoal). O vercel.json entrega este arquivo em /ferie/*:
       quem gera a prévia não executa JavaScript, então ela precisa estar no HTML. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Officine Mattio" />
  <meta property="og:title" content="Officine Mattio – Richiesta di ferie" />
  <meta property="og:description" content="Chiedi le ferie e guarda la mappa della squadra." />
  <meta property="og:image" content="https://om-shipment.vercel.app/og-ferie.jpg" />
  <meta property="og:image:secure_url" content="https://om-shipment.vercel.app/og-ferie.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Officine Mattio: montagne e un aereo, per le ferie" />
  <meta property="og:locale" content="it_IT" />
  <!-- App de celular: o manifest leva o link pessoal (token) como página de início. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ferie OM" />
  <meta name="robots" content="noindex" />
  <script>
    (function () {
      var m = location.pathname.match(/^\/ferie\/([A-Za-z0-9_-]{20,64})\/?$/);
      if (!m) return;
      var l = document.createElement('link');
      l.rel = 'manifest';
      l.href = '/api/manifest?t=' + encodeURIComponent(m[1]);
      document.head.appendChild(l);
    })();
  </script>
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Officine Mattio – Richiesta di ferie" />
  <meta name="twitter:image" content="https://om-shipment.vercel.app/og-ferie.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
